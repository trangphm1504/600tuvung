<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TOEIC 600 - Dynamic Stars & Progress</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Nạp file dữ liệu TOEIC -->
  <script src="data_toeic.js"></script>
  
  <!-- Cấu hình Firebase & Đăng nhập Google -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCizgsPFGkkdbVYl4VAqfggphPvM4l6AnQ",
      authDomain: "tuvung-ba736.firebaseapp.com",
      projectId: "tuvung-ba736",
      storageBucket: "tuvung-ba736.firebasestorage.app",
      messagingSenderId: "283132513140",
      appId: "1:283132513140:web:a388c1171785d7cfe4fa21",
      measurementId: "G-KX30813EGG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.currentUser = null;

    window.loginWithGoogle = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error("Lỗi đăng nhập:", err);
        alert("Đăng nhập thất bại: " + err.message);
      }
    };

    window.logoutGoogle = async () => {
      await signOut(auth);
      location.reload();
    };

    onAuthStateChanged(auth, async (user) => {
      window.currentUser = user;
      const loginBtn = document.getElementById('btn-login');
      const profile = document.getElementById('user-profile');
      const avatar = document.getElementById('user-avatar');

      if (user) {
        if (loginBtn) loginBtn.classList.add('hidden');
        if (profile) profile.classList.remove('hidden');
        if (avatar) avatar.src = user.photoURL || 'https://via.placeholder.com/32';

        try {
          const docRef = doc(db, "users", user.uid);
          const docSnap = await getDoc(docRef);
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.progress) {
              window.lessonProgress = data.progress;
              localStorage.setItem('toeic_lesson_progress', JSON.stringify(window.lessonProgress));
            }
            if (data.notes) {
              window.notedWords = data.notes;
              localStorage.setItem('toeic_notes', JSON.stringify(window.notedWords));
            }
            if (typeof renderLessonGrid === 'function') renderLessonGrid();
          } else {
            window.syncProgressToCloud();
          }
        } catch (e) {
          console.error("Lỗi tải đám mây:", e);
        }
      } else {
        if (loginBtn) loginBtn.classList.remove('hidden');
        if (profile) profile.classList.add('hidden');
      }
    });

    window.syncProgressToCloud = async () => {
      if (!window.currentUser) return;
      try {
        const docRef = doc(db, "users", window.currentUser.uid);
        await setDoc(docRef, {
          progress: window.lessonProgress,
          notes: window.notedWords,
          updatedAt: new Date().toISOString()
        }, { merge: true });
      } catch (e) {
        console.error("Lỗi lưu đám mây:", e);
      }
    };
  </script>

  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    .pinyin-sub { font-size: 0.75rem; line-height: 1.1rem; color: #64748b; font-family: monospace; }
  </style>
</head>
<body class="bg-slate-100 flex justify-center min-h-screen text-slate-800">

  <div class="w-full max-w-md bg-white min-h-screen flex flex-col justify-between shadow-2xl relative overflow-x-hidden">

    <!-- MÀN HÌNH 1: DANH SÁCH 50 BÀI HỌC -->
    <div id="screen-lessons" class="flex-1 flex flex-col">
      <div class="px-3 pt-8 pb-4 flex items-center justify-between border-b border-slate-100">
        <!-- Chuyển đổi nhanh giữa 3 môn -->
        <div class="flex items-center space-x-1">

            N4 Daichi
          </a>
          <a href="chukyu.html" class="text-[11px] bg-emerald-50 text-emerald-700 font-bold px-2 py-1 rounded-lg border border-emerald-200 hover:bg-emerald-100 transition shadow-sm">

  <script>
    function getToeicLessons() {
      return window.TOEIC_LESSONS || [];
    }

    window.lessonProgress = JSON.parse(localStorage.getItem('toeic_lesson_progress') || '{}');
    window.notedWords = JSON.parse(localStorage.getItem('toeic_notes') || '[]');

    function saveProgress() {
      localStorage.setItem('toeic_lesson_progress', JSON.stringify(window.lessonProgress));
      renderLessonGrid();
      if (window.syncProgressToCloud) window.syncProgressToCloud();
    }

    function resetAllProgress() {
      if (confirm("Bạn có chắc chắn muốn đặt lại toàn bộ số sao và tiến độ học?")) {
        window.lessonProgress = {};
        localStorage.removeItem('toeic_lesson_progress');
        saveProgress();
      }
    }

    let currentLessonIdx = 0;
    let currentWordIdx = 0;
    let currentWord = null;
    let isSlowSpeech = false;

    function speakText(text, rate = 1) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = isSlowSpeech ? 0.75 : rate;
        window.speechSynthesis.speak(utterance);
      }
    }

    function showScreen(screenId) {
      ['screen-lessons', 'screen-detail', 'screen-study', 'screen-practice-wrapper'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }

    window.renderLessonGrid = function() {
      const container = document.getElementById('lesson-grid');
      if (!container) return;
      container.innerHTML = '';
      
      let totalStars = 0;
      let learnedLessonsCount = 0;

      for (let i = 1; i <= 50; i++) {
        const p = (window.lessonProgress && window.lessonProgress[i]) 
                  ? window.lessonProgress[i] 
                  : { stars: 0, learned: false };

        totalStars += (p.stars || 0);
        if (p.learned) learnedLessonsCount++;

        let starsHtml = '';
        for (let s = 1; s <= 3; s++) {
          starsHtml += (s <= (p.stars || 0)) 
            ? `<i class="fa-solid fa-star text-amber-400"></i>` 
            : `<i class="fa-solid fa-star text-slate-200"></i>`;
        }

        const btn = document.createElement('button');
        const borderClass = (p.stars > 0) ? "border-blue-400 shadow-sm" : "border-slate-200 opacity-90";
        
        btn.className = `flex flex-col items-center justify-between p-2.5 rounded-2xl border-2 ${borderClass} bg-white hover:border-blue-400 active:scale-95 transition h-20`;
        btn.innerHTML = `
          <div class="w-full flex justify-end"><span class="text-[9px] font-bold bg-blue-500 text-white rounded px-1">K</span></div>
          <span class="text-lg font-bold text-blue-600">${i}</span>
          <div class="text-[9px] flex space-x-0.5">${starsHtml}</div>
        `;
        btn.onclick = () => openLesson(i - 1);
        container.appendChild(btn);
      }

      const totalStarsEl = document.getElementById('total-stars-count');
      const learnedWordsEl = document.getElementById('learned-words-count');
      if (totalStarsEl) totalStarsEl.innerText = totalStars;
      if (learnedWordsEl) learnedWordsEl.innerText = learnedLessonsCount * 12;
    };

    function openNextUnfinishedLesson() {
      for (let i = 1; i <= 50; i++) {
        const p = window.lessonProgress[i];
        if (!p || p.stars === 0) {
          openLesson(i - 1);
          return;
        }
      }
      openLesson(0);
    }

    function openLesson(lessonIndex) {
      const lessons = getToeicLessons();
      if (!lessons[lessonIndex]) {
        alert("Đang nạp dữ liệu bài học, vui lòng đợi 1 giây rồi thử lại!");
        return;
      }
      currentLessonIdx = lessonIndex;
      const lesson = lessons[lessonIndex];
      document.getElementById('detail-title').innerText = `Cửa số ${lesson.id} - ${lesson.title}`;

      const listContainer = document.getElementById('detail-word-list');
      listContainer.innerHTML = '';

      lesson.words.forEach(w => {
        const row = document.createElement('div');
        row.className = "py-3.5 flex flex-col justify-center";
        row.innerHTML = `
          <span class="text-xs text-slate-400 font-mono">${w.ipa}</span>
          <h4 class="text-xl font-bold text-slate-800">${w.word}</h4>
          <p class="text-xs text-slate-500 mt-0.5"><span class="text-blue-500 mr-2 font-medium">${w.pos}</span>${w.meaning}</p>
        `;
        listContainer.appendChild(row);
      });

      showScreen('screen-detail');
    }

    function startLearningMode() {
      currentWordIdx = 0;
      loadStudyWord();
      showScreen('screen-study');
    }

    function loadStudyWord() {
      const lessons = getToeicLessons();
      const words = lessons[currentLessonIdx].words;
      currentWord = words[currentWordIdx];

      const percent = ((currentWordIdx + 1) / words.length) * 100;
      document.getElementById('study-progress-bar').style.width = `${percent}%`;

      document.getElementById('study-word').innerText = currentWord.word;
      document.getElementById('study-ipa').innerText = currentWord.ipa;
      document.getElementById('study-pos').innerText = currentWord.pos;
      document.getElementById('study-meaning').innerText = currentWord.meaning;
      document.getElementById('study-meaning').classList.add('hidden');

      document.getElementById('ex1-en').innerText = currentWord.example1.en;
      document.getElementById('ex1-ipa').innerText = currentWord.example1.ipa || "";
      document.getElementById('ex1-vi').innerText = currentWord.example1.vi;
      document.getElementById('ex1-vi').classList.add('hidden');

      const ex2 = currentWord.example2 || currentWord.example1;
      document.getElementById('ex2-en').innerText = ex2.en;
      document.getElementById('ex2-ipa').innerText = ex2.ipa || "";
      document.getElementById('ex2-vi').innerText = ex2.vi;
      document.getElementById('ex2-vi').classList.add('hidden');

      document.getElementById('btn-show-meaning').classList.remove('hidden');
      document.getElementById('btn-next-word').classList.add('hidden');

      updateBookmarkIcon();
      speakText(currentWord.word);
    }

    function revealMeaning() {
      document.getElementById('study-meaning').classList.remove('hidden');
      document.getElementById('ex1-vi').classList.remove('hidden');
      document.getElementById('ex2-vi').classList.remove('hidden');
      document.getElementById('btn-show-meaning').classList.add('hidden');
      document.getElementById('btn-next-word').classList.remove('hidden');
    }

    function nextStudyWord() {
      const lessons = getToeicLessons();
      const words = lessons[currentLessonIdx].words;
      if (currentWordIdx < words.length - 1) {
        currentWordIdx++;
        loadStudyWord();
      } else {
        const lessonNum = lessons[currentLessonIdx].id;
        if (!window.lessonProgress[lessonNum]) window.lessonProgress[lessonNum] = { stars: 0, learned: false };
        window.lessonProgress[lessonNum].learned = true;
        if (window.lessonProgress[lessonNum].stars < 1) window.lessonProgress[lessonNum].stars = 1;
        saveProgress();
        alert("Đã xem qua 12 từ! Đạt ⭐ 1 SAO. Tiếp tục luyện tập để đạt 3 sao!");
        startCombinedPractice();
      }
    }

    function toggleNoteWord() {
      const idx = window.notedWords.indexOf(currentWord.id);
      if (idx > -1) window.notedWords.splice(idx, 1);
      else window.notedWords.push(currentWord.id);
      localStorage.setItem('toeic_notes', JSON.stringify(window.notedWords));
      updateBookmarkIcon();
      if (window.syncProgressToCloud) window.syncProgressToCloud();
    }

    function updateBookmarkIcon() {
      const isNoted = window.notedWords.includes(currentWord.id);
      const icon = document.querySelector('#btn-bookmark i');
      icon.className = isNoted ? "fa-solid fa-star text-amber-500" : "fa-regular fa-star text-slate-400";
    }

    function toggleSlowSpeed() {
      isSlowSpeech = !isSlowSpeech;
      const btn = document.getElementById('btn-tortoise');
      btn.className = isSlowSpeech ? "text-amber-500 font-bold" : "hover:text-blue-500 transition text-base";
      speakText(currentWord.word);
    }

    let practiceTasks = [];
    let currentTaskIdx = 0;
    let correctAnswersCount = 0;
    let totalQuestionsCount = 0;

    function startCombinedPractice() {
      const lessons = getToeicLessons();
      const words = lessons[currentLessonIdx].words;
      practiceTasks = [];
      correctAnswersCount = 0;

      // 1. 4 câu Chọn nghĩa
      const shuffledForMeaning = [...words].sort(() => Math.random() - 0.5).slice(0, 4);
      shuffledForMeaning.forEach(w => practiceTasks.push({ type: 'meaning', data: w }));

      // 2. 3 câu Nghe điền câu (Đã sửa lỗi nhận diện thể chia từ vựng & ẩn IPA làm lộ từ)
      const shuffledForGap = [...words].sort(() => Math.random() - 0.5).slice(0, 3);
      shuffledForGap.forEach(w => {
        const sentence = w.example1.en;
        let gapSentence = sentence;
        
        // Bắt từ gốc và các hậu tố biến đổi chia thì (-s, -es, -ed, -d, -ing, -ly, ...)
        const wordRegex = new RegExp(`\\b${w.word}[a-z]*\\b`, 'i');
        if (wordRegex.test(sentence)) {
          gapSentence = sentence.replace(wordRegex, '_______');
        } else {
          const firstWord = w.word.split(' ')[0];
          const firstWordRegex = new RegExp(`\\b${firstWord}[a-z]*\\b`, 'i');
          gapSentence = sentence.replace(firstWordRegex, '_______');
        }

        practiceTasks.push({
          type: 'gap',
          data: {
            word: w.word,
            ipa: w.ipa,
            fullSentence: w.example1.en,
            vi: w.example1.vi,
            gapSentence: gapSentence
          }
        });
      });

      // 3. 1 bài Ghép cặp âm thanh (4 từ)
      const shuffledForMatch = [...words].sort(() => Math.random() - 0.5).slice(0, 4);
      practiceTasks.push({ type: 'match', data: shuffledForMatch });

      practiceTasks.sort(() => Math.random() - 0.5);
      totalQuestionsCount = practiceTasks.length;
      currentTaskIdx = 0;

      showScreen('screen-practice-wrapper');
      renderCurrentPracticeTask();
    }

    let currentGapTaskData = null;
    function renderCurrentPracticeTask() {
      document.getElementById('part-quiz-meaning').classList.add('hidden');
      document.getElementById('part-quiz-gap').classList.add('hidden');
      document.getElementById('part-quiz-match').classList.add('hidden');
      document.getElementById('part-quiz-finish').classList.add('hidden');

      if (currentTaskIdx >= practiceTasks.length) {
        const percent = Math.round((correctAnswersCount / totalQuestionsCount) * 100);
        let awardedStars = percent >= 85 ? 3 : (percent >= 60 ? 2 : 1);

        const lessons = getToeicLessons();
        const lessonNum = lessons[currentLessonIdx].id;
        if (!window.lessonProgress[lessonNum]) window.lessonProgress[lessonNum] = { stars: 0, learned: true };
        if (awardedStars > window.lessonProgress[lessonNum].stars) {
          window.lessonProgress[lessonNum].stars = awardedStars;
        }
        saveProgress();

        let starIcons = '';
        for (let s = 1; s <= 3; s++) {
          starIcons += s <= awardedStars ? `<i class="fa-solid fa-star text-amber-400"></i>` : `<i class="fa-solid fa-star text-slate-200"></i>`;
        }
        document.getElementById('finish-stars').innerHTML = starIcons;
        document.getElementById('finish-score-desc').innerText = `Chính xác ${correctAnswersCount}/${totalQuestionsCount} câu (${percent}%)`;
        document.getElementById('finish-title').innerText = awardedStars === 3 ? "Xuất sắc! Đạt 3 sao" : (awardedStars === 2 ? "Rất tốt! Đạt 2 sao" : "Hoàn thành! Đạt 1 sao");

        document.getElementById('practice-progress-bar').style.width = '100%';
        document.getElementById('practice-counter').innerText = `${practiceTasks.length}/${practiceTasks.length}`;
        document.getElementById('practice-header-title').innerText = "Kết quả bài tập";
        document.getElementById('part-quiz-finish').classList.remove('hidden');
        return;
      }

      const percent = (currentTaskIdx / practiceTasks.length) * 100;
      document.getElementById('practice-progress-bar').style.width = `${percent}%`;
      document.getElementById('practice-counter').innerText = `${currentTaskIdx + 1}/${practiceTasks.length}`;

      const task = practiceTasks[currentTaskIdx];
      if (task.type === 'meaning') renderPartMeaning(task.data);
      else if (task.type === 'gap') renderPartGap(task.data);
      else if (task.type === 'match') renderPartMatch(task.data);
    }

    function renderPartMeaning(wordObj) {
      document.getElementById('practice-header-title').innerText = "Chọn nghĩa của từ";
      document.getElementById('part-quiz-meaning').classList.remove('hidden');
      document.getElementById('pq1-word').innerText = wordObj.word;
      document.getElementById('pq1-ipa').innerText = wordObj.ipa;

      const lessons = getToeicLessons();
      const allWords = lessons[currentLessonIdx].words;
      let options = [wordObj.meaning];
      while (options.length < 4) {
        const randomM = allWords[Math.floor(Math.random() * allWords.length)].meaning;
        if (!options.includes(randomM)) options.push(randomM);
      }
      options.sort(() => Math.random() - 0.5);

      const letters = ['A', 'B', 'C', 'D'];
      const container = document.getElementById('pq1-options');
      container.innerHTML = '';

      let answered = false;
      options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full flex items-center p-4 rounded-2xl border border-slate-200 hover:border-blue-400 text-left text-sm font-medium text-slate-700 transition";
        btn.innerHTML = `<span class="w-6 text-slate-400 font-semibold">${letters[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => {
          if (answered) return;
          answered = true;
          if (opt === wordObj.meaning) {
            correctAnswersCount++;
            btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-700');
          } else {
            btn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-700');
          }
          setTimeout(() => {
            currentTaskIdx++;
            renderCurrentPracticeTask();
          }, 500);
        };
        container.appendChild(btn);
      });
      speakText(wordObj.word);
    }

    function renderPartGap(gapData) {
      currentGapTaskData = gapData;
      document.getElementById('practice-header-title').innerText = "Nghe âm thanh, điền từ vào chỗ trống";
      document.getElementById('part-quiz-gap').classList.remove('hidden');

      // Hiển thị bản dịch nghĩa tiếng Việt của câu để gợi ý thay vì phiên âm ngữ âm làm lộ từ
      const ipaEl = document.getElementById('pq2-ipa');
      if (ipaEl) {
        ipaEl.innerText = gapData.vi || "";
      }

      document.getElementById('pq2-sentence').innerHTML = gapData.gapSentence.replace(
        '_______', 
        '<span class="inline-block border-b-2 border-sky-500 text-sky-600 font-bold px-3 mx-1 min-w-[80px] text-center">_____</span>'
      );

      const lessons = getToeicLessons();
      const allWords = lessons[currentLessonIdx].words;
      let options = [{ word: gapData.word, ipa: gapData.ipa }];
      while (options.length < 4) {
        const rand = allWords[Math.floor(Math.random() * allWords.length)];
        if (!options.some(o => o.word === rand.word)) {
          options.push({ word: rand.word, ipa: rand.ipa });
        }
      }
      options.sort(() => Math.random() - 0.5);

      const letters = ['A', 'B', 'C', 'D'];
      const container = document.getElementById('pq2-options');
      container.innerHTML = '';

      let answered = false;
      options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full flex items-center p-3 rounded-2xl border border-slate-200 hover:border-blue-400 text-left transition bg-white shadow-sm";
        btn.innerHTML = `
          <span class="w-6 text-slate-400 font-semibold">${letters[idx]}</span>
          <div>
            <div class="text-[11px] text-slate-400 font-mono">${opt.ipa}</div>
            <div class="text-base font-bold text-slate-800">${opt.word}</div>
          </div>
        `;
        btn.onclick = () => {
          if (answered) return;
          answered = true;
          if (opt.word.toLowerCase() === gapData.word.toLowerCase()) {
            correctAnswersCount++;
            btn.classList.add('bg-emerald-50', 'border-emerald-500');
          } else {
            btn.classList.add('bg-rose-50', 'border-rose-500');
          }
          setTimeout(() => {
            currentTaskIdx++;
            renderCurrentPracticeTask();
          }, 500);
        };
        container.appendChild(btn);
      });
      speakText(gapData.fullSentence);
    }

    function playPracticeGapAudio(rate) {
      if (currentGapTaskData) speakText(currentGapTaskData.fullSentence, rate);
    }

    // ==========================================
    // LOGIC DẠNG BÀI GHÉP CẶP ÂM THANH (CHỌN HẾT MỚI BẤM KIỂM TRA)
    // ==========================================
    let matchPairsState = [];
    let currentActiveAudio = null;
    let selectedPairsMap = {}; // { [audioId]: textId }

    const PAIR_COLORS = [
      { border: "border-sky-500", bg: "bg-sky-50", text: "text-sky-700", ring: "ring-2 ring-sky-400" },
      { border: "border-amber-500", bg: "bg-amber-50", text: "text-amber-700", ring: "ring-2 ring-amber-400" },
      { border: "border-purple-500", bg: "bg-purple-50", text: "text-purple-700", ring: "ring-2 ring-purple-400" },
      { border: "border-emerald-500", bg: "bg-emerald-50", text: "text-emerald-700", ring: "ring-2 ring-emerald-400" }
    ];

    function renderPartMatch(wordsList) {
      document.getElementById('practice-header-title').innerText = "Ghép đủ 4 cặp rồi ấn kiểm tra";
      document.getElementById('part-quiz-match').classList.remove('hidden');

      matchPairsState = wordsList;
      currentActiveAudio = null;
      selectedPairsMap = {};
      document.getElementById('btn-pq3-check').disabled = true;

      const container = document.getElementById('pq3-match-container');
      container.innerHTML = '';

      let audioCol = [...wordsList].sort(() => Math.random() - 0.5);
      let textCol = [...wordsList].sort(() => Math.random() - 0.5);

      for (let i = 0; i < wordsList.length; i++) {
        // Cột bên trái: Loa âm thanh
        const audioBtn = document.createElement('button');
        const aItem = audioCol[i];
        audioBtn.id = `match-audio-${aItem.id}`;
        audioBtn.className = "h-20 bg-white border-2 border-slate-200 rounded-2xl flex items-center justify-center text-blue-500 text-xl shadow-sm transition";
        audioBtn.innerHTML = `<i class="fa-solid fa-volume-high"></i>`;
        audioBtn.onclick = () => selectAudioNode(aItem);

        // Cột bên phải: Nghĩa tiếng Việt
        const textBtn = document.createElement('button');
        const tItem = textCol[i];
        textBtn.id = `match-text-${tItem.id}`;
        textBtn.className = "h-20 px-3 bg-white border-2 border-slate-200 rounded-2xl flex items-center justify-center text-center text-xs font-semibold text-slate-700 shadow-sm transition";
        textBtn.innerText = tItem.meaning;
        textBtn.onclick = () => selectTextNode(tItem);

        container.appendChild(audioBtn);
        container.appendChild(textBtn);
      }
    }

    function selectAudioNode(audioItem) {
      speakText(audioItem.word);
      currentActiveAudio = audioItem;

      // Xóa viền nhấp nháy ở các loa khác
      document.querySelectorAll('[id^="match-audio-"]').forEach(el => {
        el.classList.remove('ring-4', 'ring-blue-400');
      });

      const audioBtn = document.getElementById(`match-audio-${audioItem.id}`);
      if (audioBtn) audioBtn.classList.add('ring-4', 'ring-blue-400');
    }

    function selectTextNode(textItem) {
      if (!currentActiveAudio) {
        alert("Vui lòng bấm nghe âm thanh ở cột bên trái trước!");
        return;
      }

      const audioId = currentActiveAudio.id;
      const textId = textItem.id;

      // Hủy liên kết cũ nếu đáp án chữ này đã được ghép
      for (const aId in selectedPairsMap) {
        if (selectedPairsMap[aId] === textId) {
          delete selectedPairsMap[aId];
        }
      }

      // Lưu cặp vừa ghép
      selectedPairsMap[audioId] = textId;
      currentActiveAudio = null;

      refreshMatchStyles();
      checkAllPairsConnected();
    }

    function refreshMatchStyles() {
      // Đặt lại style mặc định ban đầu cho tất cả các nút
      document.querySelectorAll('[id^="match-audio-"]').forEach(el => {
        el.className = "h-20 bg-white border-2 border-slate-200 rounded-2xl flex items-center justify-center text-blue-500 text-xl shadow-sm transition";
      });
      document.querySelectorAll('[id^="match-text-"]').forEach(el => {
        el.className = "h-20 px-3 bg-white border-2 border-slate-200 rounded-2xl flex items-center justify-center text-center text-xs font-semibold text-slate-700 shadow-sm transition";
      });

      // Gán màu tương ứng cho từng cặp đã ghép
      const connectedAudioIds = Object.keys(selectedPairsMap);
      connectedAudioIds.forEach((aId, index) => {
        const tId = selectedPairsMap[aId];
        const color = PAIR_COLORS[index % PAIR_COLORS.length];

        const aBtn = document.getElementById(`match-audio-${aId}`);
        const tBtn = document.getElementById(`match-text-${tId}`);

        if (aBtn) {
          aBtn.className = `h-20 border-2 rounded-2xl flex items-center justify-center text-xl shadow-sm transition ${color.bg} ${color.border} ${color.text} ${color.ring}`;
        }
        if (tBtn) {
          tBtn.className = `h-20 px-3 border-2 rounded-2xl flex items-center justify-center text-center text-xs font-bold shadow-sm transition ${color.bg} ${color.border} ${color.text} ${color.ring}`;
        }
      });
    }

    function checkAllPairsConnected() {
      const totalPairs = matchPairsState.length;
      const currentPairsCount = Object.keys(selectedPairsMap).length;
      document.getElementById('btn-pq3-check').disabled = (currentPairsCount < totalPairs);
    }

    function checkMatchSelection() {
      let allCorrect = true;
      document.getElementById('btn-pq3-check').disabled = true;

      for (const aId in selectedPairsMap) {
        const tId = selectedPairsMap[aId];
        const aBtn = document.getElementById(`match-audio-${aId}`);
        const tBtn = document.getElementById(`match-text-${tId}`);

        if (parseInt(aId) === parseInt(tId)) {
          aBtn.className = "h-20 bg-emerald-100 border-2 border-emerald-500 text-emerald-700 rounded-2xl flex items-center justify-center text-xl transition pointer-events-none";
          tBtn.className = "h-20 px-3 bg-emerald-100 border-2 border-emerald-500 text-emerald-800 font-bold text-center text-xs rounded-2xl flex items-center justify-center transition pointer-events-none";
        } else {
          allCorrect = false;
          aBtn.className = "h-20 bg-rose-100 border-2 border-rose-400 text-rose-600 rounded-2xl flex items-center justify-center text-xl transition";
          tBtn.className = "h-20 px-3 bg-rose-100 border-2 border-rose-400 text-rose-700 font-bold text-center text-xs rounded-2xl flex items-center justify-center transition";
        }
      }

      if (allCorrect) {
        correctAnswersCount++;
        setTimeout(() => {
          currentTaskIdx++;
          renderCurrentPracticeTask();
        }, 800);
      } else {
        setTimeout(() => {
          alert("Có đáp án chưa chính xác, hãy nghe và nối lại nhé!");
          selectedPairsMap = {};
          refreshMatchStyles();
          checkAllPairsConnected();
        }, 900);
      }
    }

    function finishAndBackToLessons() {
      showScreen('screen-lessons');
    }

    window.onload = () => {
      setTimeout(() => {
        renderLessonGrid();
      }, 50);
    };
  </script>
</body>
</html>
