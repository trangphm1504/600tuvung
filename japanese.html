<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>N4 Daichi 2 - Từ vựng & Ngữ pháp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Cấu hình Firebase & Đồng bộ dữ liệu -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCizgsPFGkkdbVYl4VAqfggphPvM4l6AnQ",
      authDomain: "tuvung-ba736.firebaseapp.com",
      projectId: "tuvung-ba736",
      storageBucket: "tuvung-ba736.firebasestorage.app",
      messagingSenderId: "283132513140",
      appId: "1:283132513140:web:a388c1171785d7cfe4fa21",
      measurementId: "G-KX30813EGG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.currentUser = null;

    window.loginWithGoogle = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("Đăng nhập thất bại: " + err.message);
      }
    };

    window.logoutGoogle = async () => {
      await signOut(auth);
      location.reload();
    };

    onAuthStateChanged(auth, async (user) => {
      window.currentUser = user;
      const loginBtn = document.getElementById('btn-login');
      const profile = document.getElementById('user-profile');
      const avatar = document.getElementById('user-avatar');

      if (user) {
        if (loginBtn) loginBtn.classList.add('hidden');
        if (profile) profile.classList.remove('hidden');
        if (avatar) avatar.src = user.photoURL || 'https://via.placeholder.com/32';

        try {
          const docRef = doc(db, "users", user.uid);
          const docSnap = await getDoc(docRef);
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.japaneseProgress) {
              window.jaProgress = data.japaneseProgress;
              localStorage.setItem('daichi_lesson_progress', JSON.stringify(window.jaProgress));
            }
            if (typeof renderLessonGrid === 'function') renderLessonGrid();
          } else {
            window.syncProgressToCloud();
          }
        } catch (e) {
          console.error("Lỗi tải đám mây:", e);
        }
      } else {
        if (loginBtn) loginBtn.classList.remove('hidden');
        if (profile) profile.classList.add('hidden');
      }
    });

    window.syncProgressToCloud = async () => {
      if (!window.currentUser) return;
      try {
        const docRef = doc(db, "users", window.currentUser.uid);
        await setDoc(docRef, {
          japaneseProgress: window.jaProgress,
          updatedAt: new Date().toISOString()
        }, { merge: true });
      } catch (e) {
        console.error("Lỗi lưu đám mây:", e);
      }
    };
  </script>

  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    .furigana-sub { font-size: 0.85rem; line-height: 1.2rem; color: #64748b; }
  </style>
</head>
<body class="bg-slate-100 flex justify-center min-h-screen text-slate-800">

  <div class="w-full max-w-md bg-white min-h-screen flex flex-col justify-between shadow-2xl relative overflow-x-hidden">

    <!-- ========================================== -->
    <!-- MÀN HÌNH 1: DANH SÁCH BÀI HỌC (DAICHI 2) -->
    <!-- ========================================== -->
    <div id="screen-lessons" class="flex-1 flex flex-col">
      <div class="px-5 pt-8 pb-4 flex items-center justify-between border-b border-slate-100">
        <!-- Nút nhảy về file TOEIC Tiếng Anh -->
        <a href="index.html" class="text-xs bg-amber-50 text-amber-700 font-bold px-2.5 py-1.5 rounded-full border border-amber-200 hover:bg-amber-100 transition flex items-center shadow-sm">
          <i class="fa-solid fa-arrow-left mr-1"></i> TOEIC
        </a>

        <div class="flex items-center space-x-1.5 font-bold text-slate-800 text-base">
          <span>大地 2 (N4)</span>
        </div>
        
        <div class="flex items-center space-x-2">
          <button id="btn-login" onclick="loginWithGoogle()" class="text-xs bg-blue-50 text-blue-600 font-bold px-2.5 py-1 rounded-full border border-blue-200 hover:bg-blue-100 transition flex items-center shadow-sm">
            <i class="fa-brands fa-google mr-1"></i> Đồng bộ
          </button>
          
          <div id="user-profile" class="hidden flex items-center space-x-1 cursor-pointer" onclick="if(confirm('Bạn có muốn đăng xuất?')) logoutGoogle();">
            <img id="user-avatar" class="w-7 h-7 rounded-full border-2 border-emerald-400 object-cover" src="" alt="avatar">
          </div>

          <button onclick="resetAllProgress()" class="text-slate-500 hover:text-rose-500 ml-1"><i class="fa-solid fa-rotate-left"></i></button>
        </div>
      </div>

      <!-- Banner tổng quan Daichi 2 -->
      <div class="p-4">
        <div class="bg-red-50/70 border border-red-100 rounded-2xl p-4 flex items-center space-x-4">
          <div class="w-16 h-16 bg-red-500 rounded-2xl flex items-center justify-center text-white text-2xl font-extrabold shadow-md shadow-red-500/30">
            日
          </div>
          <div>
            <h3 class="font-bold text-slate-900 text-base">大地 2 - Tiếng Nhật N4</h3>
            <p class="text-xs text-slate-500 mt-0.5">20 bài học (Bài 23 ~ Bài 42)</p>
            <div class="flex items-center space-x-3 mt-2 text-xs font-semibold">
              <span class="text-red-600 flex items-center"><i class="fa-solid fa-book-open mr-1"></i> Bài 23 ~ 42</span>
              <span class="text-amber-500 flex items-center"><i class="fa-solid fa-star mr-1"></i> <span id="total-stars-count">0</span>/60 sao</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Lưới bài học: Bài 23 đến 42 -->
      <div class="px-4 flex-1">
        <div class="text-xs font-bold text-red-500 flex items-center mb-3">
          <span class="w-2 h-2 rounded-full bg-red-500 mr-1.5"></span> Danh sách bài học (第23課 ~ 第42課)
        </div>
        <div class="grid grid-cols-5 gap-3" id="lesson-grid"></div>
      </div>

      <div class="p-4">
        <button onclick="openLesson(0)" class="w-full py-3.5 bg-red-500 hover:bg-red-600 text-white font-bold rounded-2xl shadow-lg shadow-red-500/30 transition">
          Vào học bài tiếp theo
        </button>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- MÀN HÌNH 2: DANH SÁCH TỪ TRONG BÀI -->
    <!-- ========================================== -->
    <div id="screen-detail" class="hidden flex-1 flex flex-col bg-white">
      <div class="px-5 pt-8 pb-3 flex items-center border-b border-slate-100">
        <button onclick="showScreen('screen-lessons')" class="text-slate-600 text-lg mr-4">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h2 id="detail-title" class="font-bold text-slate-900 text-lg">第23課</h2>
      </div>

      <div class="px-5 py-3 text-sm text-slate-400 font-medium">Danh sách từ vựng trọng tâm</div>

      <div class="flex-1 overflow-y-auto px-5 divide-y divide-slate-100" id="detail-word-list"></div>

      <div class="p-4 bg-white border-t border-slate-100 grid grid-cols-2 gap-3">
        <button onclick="startLearningMode()" class="py-3 bg-red-100 hover:bg-red-200 text-red-600 font-bold rounded-2xl transition">
          Học từ vựng
        </button>
        <button onclick="startCombinedPractice()" class="py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-2xl shadow-md shadow-red-500/20 transition">
          Luyện tập
        </button>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- MÀN HÌNH 3: HỌC TỪ (FLIP/TTS) -->
    <!-- ========================================== -->
    <div id="screen-study" class="hidden flex-1 flex flex-col justify-between bg-white">
      <div>
        <div class="h-1 bg-slate-100 w-full">
          <div id="study-progress-bar" class="h-full bg-red-500 transition-all duration-300 w-0"></div>
        </div>
        <div class="px-5 py-3 flex items-center justify-between text-slate-400">
          <button onclick="showScreen('screen-detail')" class="hover:text-slate-600 text-base"><i class="fa-solid fa-pause"></i></button>
          <div class="flex items-center space-x-4">
            <button onclick="toggleSlowSpeed()" id="btn-tortoise" class="hover:text-red-500 transition text-base"><i class="fa-solid fa-shield-cat"></i></button>
          </div>
        </div>
      </div>

      <div class="px-6 flex-1 flex flex-col">
        <div class="mt-4 pb-6 border-b border-slate-100">
          <div class="flex justify-between items-start">
            <div>
              <div id="study-furigana" class="text-slate-400 font-medium text-base mb-0.5"></div>
              <h1 id="study-kanji" class="text-4xl font-extrabold text-slate-900 tracking-tight"></h1>
            </div>
            <button onclick="speakJapanese(currentWord.kanji)" class="text-red-500 text-2xl hover:scale-110 active:scale-95 transition p-2">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </div>
          <div class="mt-3 flex items-center space-x-2">
            <span id="study-pos" class="text-xs font-semibold text-red-600 bg-red-50 px-2.5 py-1 rounded-md"></span>
          </div>
          <div id="study-meaning" class="hidden mt-3 text-slate-700 font-semibold text-base"></div>
        </div>

        <div class="mt-6 space-y-6 flex-1">
          <div>
            <div class="flex justify-between items-start">
              <div>
                <p id="ex1-ja" class="text-lg text-slate-800 font-medium"></p>
                <p id="ex1-reading" class="furigana-sub mt-0.5"></p>
                <p id="ex1-vi" class="hidden text-xs text-slate-500 mt-1.5"></p>
              </div>
              <button onclick="speakJapanese(currentWord.example.ja)" class="text-red-400 hover:text-red-600 text-lg ml-3 p-1">
                <i class="fa-solid fa-volume-high"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="p-5">
        <button id="btn-show-meaning" onclick="revealMeaning()" class="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-2xl transition">
          Nhấp vào để xem giải nghĩa
        </button>
        <button id="btn-next-word" onclick="nextStudyWord()" class="hidden w-full py-3.5 bg-red-500 hover:bg-red-600 text-white font-bold rounded-2xl shadow-lg shadow-red-500/25 transition">
          Từ tiếp theo
        </button>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- MÀN HÌNH 4: LUYỆN TẬP KẾT HỢP -->
    <!-- ========================================== -->
    <div id="screen-practice-wrapper" class="hidden flex-1 flex flex-col justify-between bg-white">
      <div>
        <div class="h-1 bg-slate-100 w-full">
          <div id="practice-progress-bar" class="h-full bg-red-500 transition-all duration-300 w-0"></div>
        </div>
        <div class="px-5 py-4 flex items-center justify-between text-slate-400">
          <button onclick="showScreen('screen-detail')"><i class="fa-solid fa-pause"></i></button>
          <span id="practice-header-title" class="text-xs font-bold text-slate-500 uppercase tracking-wider">Luyện tập</span>
          <span id="practice-counter" class="text-xs font-bold text-red-600">1/6</span>
        </div>
      </div>

      <!-- VÙNG 1: CHỌN NGHĨA -->
      <div id="part-quiz-meaning" class="hidden flex-1 flex flex-col justify-between px-6 py-4">
        <div class="text-center my-auto">
          <div id="pq1-furigana" class="text-base text-slate-400 mb-1"></div>
          <h2 id="pq1-kanji" class="text-4xl font-extrabold text-slate-900 tracking-tight"></h2>
        </div>
        <div class="space-y-3 mb-4" id="pq1-options"></div>
      </div>

      <!-- VÙNG 2: NGHE ĐIỀN CÂU NGỮ PHÁP -->
      <div id="part-quiz-gap" class="hidden flex-1 flex flex-col justify-between px-6 py-4">
        <div class="flex-1 flex flex-col items-center justify-center">
          <button onclick="speakJapanese(currentGapTaskData.fullJa)" class="w-20 h-20 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white rounded-full flex items-center justify-center text-3xl shadow-lg shadow-rose-500/30 transition mb-6">
            <i class="fa-solid fa-volume-high"></i>
          </button>
          <div class="text-center">
            <p id="pq2-reading" class="text-xs text-slate-400 mb-1.5"></p>
            <p id="pq2-sentence" class="text-xl font-bold text-slate-800 leading-relaxed"></p>
          </div>
        </div>
        <div class="space-y-3 mb-4" id="pq2-options"></div>
      </div>

      <!-- VÙNG TỔNG KẾT VÀ TÍNH SAO -->
      <div id="part-quiz-finish" class="hidden flex-1 flex flex-col items-center justify-center p-8 text-center">
        <div class="w-24 h-24 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center text-4xl shadow-inner mb-4">
          <i class="fa-solid fa-trophy"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-900" id="finish-title">Hoàn thành bài tập!</h2>
        <div class="flex items-center justify-center space-x-2 my-3 text-3xl" id="finish-stars"></div>
        <p class="text-sm text-slate-500 mt-1" id="finish-score-desc"></p>
        <button onclick="finishAndBackToLessons()" class="mt-8 w-full py-3.5 bg-red-500 hover:bg-red-600 text-white font-bold rounded-2xl shadow-lg transition">
          Xác nhận & Lưu tiến độ
        </button>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // DỮ LIỆU TỪ VỰNG BÀI 23 - GIÁO TRÌNH DAICHI 2 (N4)
    // ==========================================
    const JAPANESE_LESSONS = [
      {
        id: 23,
        title: "第23課 - Sự biến đổi trạng thái & Điều kiện と",
        words: [
          { id: 2301, kanji: "なる", furigana: "なる", pos: "Động từ nhóm I", meaning: "trở thành, trở nên", example: { ja: "春になると、暖かくなります。", reading: "はるになると、あたたかくなります。", vi: "Hễ đến mùa xuân thì trời trở nên ấm áp." } },
          { id: 2302, kanji: "開く", furigana: "あく", pos: "Tự động từ nhóm I", meaning: "mở (cửa tự mở)", example: { ja: "ボタンを押すと、ドアが開きます。", reading: "ボタンをおすと、ドアがあきます。", vi: "Ấn cái nút này là cửa tự mở ra." } },
          { id: 2303, kanji: "つく", furigana: "つく", pos: "Tự động từ nhóm I", meaning: "(đèn) được bật sáng", example: { ja: "電気がつきました。", reading: "でんきがつきました。", vi: "Đèn đã bật sáng." } },
          { id: 2304, kanji: "曲がる", furigana: "まがる", pos: "Động từ nhóm I", meaning: "quẹo, rẽ", example: { ja: "右へ曲がると、郵便局があります。", reading: "みぎへまがると、ゆうびんきょくがあります。", vi: "Rẽ sang bên phải là thấy bưu điện." } },
          { id: 2305, kanji: "渡る", furigana: "わたる", pos: "Động từ nhóm I", meaning: "băng qua (cầu, đường)", example: { ja: "あの交差点を渡ります。", reading: "あのおうだんほどうをわたります。", vi: "Băng qua ngã tư đằng kia." } },
          { id: 2306, kanji: "消える", furigana: "きえる", pos: "Tự động từ nhóm II", meaning: "(đèn, lửa) tắt", example: { ja: "電気が消えました。", reading: "でんきがきえました。", vi: "Đèn điện bị tắt." } },
          { id: 2307, kanji: "聞こえる", furigana: "きこえる", pos: "Động từ nhóm II", meaning: "nghe thấy (tự nhiên lọt vào tai)", example: { ja: "鳥の声が聞こえます。", reading: "とりのこえがきこえます。", vi: "Nghe thấy tiếng chim hót." } },
          { id: 2308, kanji: "汚い", furigana: "きたない", pos: "Tính từ đuôi い", meaning: "dơ bẩn", example: { ja: "部屋が汚くなりました。", reading: "へやがきたなくなりました。", vi: "Căn phòng đã trở nên dơ bẩn." } },
          { id: 2309, kanji: "丈夫[な]", furigana: "じょうぶ[な]", pos: "Tính từ đuôi な", meaning: "bền, rắn chắc", example: { ja: "この靴は丈夫です。", reading: "このくつはじょうぶです。", vi: "Đôi giày này rất bền chắc." } },
          { id: 2310, kanji: "まっすぐ", furigana: "まっすぐ", pos: "Phó từ", meaning: "thẳng (đi thẳng)", example: { ja: "まっすぐ行くと、駅があります。", reading: "まっすぐいくと、えきがあります。", vi: "Đi thẳng là tới nhà ga." } },
          { id: 2311, kanji: "交差点", furigana: "こうさてん", pos: "Danh từ", meaning: "ngã tư, giao lộ", example: { ja: "交差点を右に曲がります。", reading: "こうさてんをみぎにまがります。", vi: "Rẽ phải ở ngã tư." } },
          { id: 2312, kanji: "季節", furigana: "きせつ", pos: "Danh từ", meaning: "mùa", example: { ja: "一番いい季節は春です。", reading: "いちばんいいきせつははるです。", vi: "Mùa dễ chịu nhất là mùa xuân." } }
        ]
      }
    ];

    window.jaProgress = JSON.parse(localStorage.getItem('daichi_lesson_progress') || '{}');

    function saveProgress() {
      localStorage.setItem('daichi_lesson_progress', JSON.stringify(window.jaProgress));
      renderLessonGrid();
      if (window.syncProgressToCloud) window.syncProgressToCloud();
    }

    function resetAllProgress() {
      if (confirm("Đặt lại toàn bộ tiến trình học tiếng Nhật?")) {
        window.jaProgress = {};
        localStorage.removeItem('daichi_lesson_progress');
        saveProgress();
      }
    }

    let isSlowSpeech = false;
    function speakJapanese(text, rate = 1) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = isSlowSpeech ? 0.7 : rate;
        window.speechSynthesis.speak(utterance);
      }
    }

    function toggleSlowSpeed() {
      isSlowSpeech = !isSlowSpeech;
      const btn = document.getElementById('btn-tortoise');
      btn.className = isSlowSpeech ? "text-amber-500 font-bold" : "hover:text-red-500 transition text-base";
      if (currentWord) speakJapanese(currentWord.kanji);
    }

    function showScreen(screenId) {
      ['screen-lessons', 'screen-detail', 'screen-study', 'screen-practice-wrapper'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }

    // Render 20 bài từ Bài 23 đến 42
    window.renderLessonGrid = function() {
      const container = document.getElementById('lesson-grid');
      container.innerHTML = '';
      let totalStars = 0;

      for (let i = 23; i <= 42; i++) {
        const p = window.jaProgress[i] || { stars: 0 };
        totalStars += p.stars;

        let starsHtml = '';
        for (let s = 1; s <= 3; s++) {
          if (s <= p.stars) starsHtml += `<i class="fa-solid fa-star text-amber-400"></i>`;
          else starsHtml += `<i class="fa-solid fa-star text-slate-200"></i>`;
        }

        const btn = document.createElement('button');
        const borderClass = p.stars > 0 ? "border-red-400 shadow-sm" : "border-slate-200 opacity-90";
        btn.className = `flex flex-col items-center justify-between p-2.5 rounded-2xl border-2 ${borderClass} bg-white hover:border-red-400 active:scale-95 transition h-20`;
        btn.innerHTML = `
          <div class="w-full flex justify-end"><span class="text-[9px] font-bold bg-red-500 text-white rounded px-1">N4</span></div>
          <span class="text-base font-bold text-red-600">${i}</span>
          <div class="text-[9px] flex space-x-0.5">${starsHtml}</div>
        `;
        btn.onclick = () => openLesson(0);
        container.appendChild(btn);
      }
      document.getElementById('total-stars-count').innerText = totalStars;
    };

    let currentLessonIdx = 0;
    let currentWordIdx = 0;
    let currentWord = null;

    function openLesson(idx) {
      currentLessonIdx = idx;
      const lesson = JAPANESE_LESSONS[idx];
      document.getElementById('detail-title').innerText = lesson.title;

      const listContainer = document.getElementById('detail-word-list');
      listContainer.innerHTML = '';

      lesson.words.forEach(w => {
        const row = document.createElement('div');
        row.className = "py-3 flex flex-col justify-center";
        row.innerHTML = `
          <span class="text-xs text-slate-400 font-medium">${w.furigana}</span>
          <h4 class="text-xl font-bold text-slate-800">${w.kanji}</h4>
          <p class="text-xs text-slate-500 mt-0.5"><span class="text-red-500 mr-2 font-medium">${w.pos}</span>${w.meaning}</p>
        `;
        listContainer.appendChild(row);
      });
      showScreen('screen-detail');
    }

    function startLearningMode() {
      currentWordIdx = 0;
      loadStudyWord();
      showScreen('screen-study');
    }

    function loadStudyWord() {
      const words = JAPANESE_LESSONS[currentLessonIdx].words;
      currentWord = words[currentWordIdx];

      const percent = ((currentWordIdx + 1) / words.length) * 100;
      document.getElementById('study-progress-bar').style.width = `${percent}%`;

      document.getElementById('study-furigana').innerText = currentWord.furigana;
      document.getElementById('study-kanji').innerText = currentWord.kanji;
      document.getElementById('study-pos').innerText = currentWord.pos;
      document.getElementById('study-meaning').innerText = currentWord.meaning;
      document.getElementById('study-meaning').classList.add('hidden');

      document.getElementById('ex1-ja').innerText = currentWord.example.ja;
      document.getElementById('ex1-reading').innerText = currentWord.example.reading;
      document.getElementById('ex1-vi').innerText = currentWord.example.vi;
      document.getElementById('ex1-vi').classList.add('hidden');

      document.getElementById('btn-show-meaning').classList.remove('hidden');
      document.getElementById('btn-next-word').classList.add('hidden');
      speakJapanese(currentWord.kanji);
    }

    function revealMeaning() {
      document.getElementById('study-meaning').classList.remove('hidden');
      document.getElementById('ex1-vi').classList.remove('hidden');
      document.getElementById('btn-show-meaning').classList.add('hidden');
      document.getElementById('btn-next-word').classList.remove('hidden');
    }

    function nextStudyWord() {
      const words = JAPANESE_LESSONS[currentLessonIdx].words;
      if (currentWordIdx < words.length - 1) {
        currentWordIdx++;
        loadStudyWord();
      } else {
        const lessonNum = JAPANESE_LESSONS[currentLessonIdx].id;
        if (!window.jaProgress[lessonNum]) window.jaProgress[lessonNum] = { stars: 0 };
        if (window.jaProgress[lessonNum].stars < 1) window.jaProgress[lessonNum].stars = 1;
        saveProgress();
        alert("Bạn đã học xong từ vựng Bài 23! Nhận ⭐ 1 SAO. Tiếp tục luyện tập để đạt 3 sao!");
        startCombinedPractice();
      }
    }

    // Luyện tập
    let practiceTasks = [];
    let currentTaskIdx = 0;
    let correctAnswersCount = 0;

    function startCombinedPractice() {
      const words = JAPANESE_LESSONS[currentLessonIdx].words;
      practiceTasks = [];
      correctAnswersCount = 0;

      // 4 câu chọn nghĩa
      const shuffledMeaning = [...words].sort(() => Math.random() - 0.5).slice(0, 4);
      shuffledMeaning.forEach(w => practiceTasks.push({ type: 'meaning', data: w }));

      // 2 câu nghe điền câu ví dụ ngữ pháp
      const shuffledGap = [...words].sort(() => Math.random() - 0.5).slice(0, 2);
      shuffledGap.forEach(w => {
        practiceTasks.push({
          type: 'gap',
          data: {
            word: w.kanji,
            reading: w.furigana,
            fullJa: w.example.ja,
            sentenceReading: w.example.reading,
            gapSentence: w.example.ja.replace(w.kanji, '_______')
          }
        });
      });

      practiceTasks.sort(() => Math.random() - 0.5);
      currentTaskIdx = 0;
      showScreen('screen-practice-wrapper');
      renderCurrentPracticeTask();
    }

    let currentGapTaskData = null;
    function renderCurrentPracticeTask() {
      document.getElementById('part-quiz-meaning').classList.add('hidden');
      document.getElementById('part-quiz-gap').classList.add('hidden');
      document.getElementById('part-quiz-finish').classList.add('hidden');

      if (currentTaskIdx >= practiceTasks.length) {
        const percent = Math.round((correctAnswersCount / practiceTasks.length) * 100);
        let awardedStars = percent >= 80 ? 3 : (percent >= 60 ? 2 : 1);

        const lessonNum = JAPANESE_LESSONS[currentLessonIdx].id;
        if (!window.jaProgress[lessonNum]) window.jaProgress[lessonNum] = { stars: 0 };
        if (awardedStars > window.jaProgress[lessonNum].stars) {
          window.jaProgress[lessonNum].stars = awardedStars;
        }
        saveProgress();

        let starIcons = '';
        for (let s = 1; s <= 3; s++) {
          starIcons += s <= awardedStars ? `<i class="fa-solid fa-star text-amber-400"></i>` : `<i class="fa-solid fa-star text-slate-200"></i>`;
        }
        document.getElementById('finish-stars').innerHTML = starIcons;
        document.getElementById('finish-score-desc').innerText = `Chính xác ${correctAnswersCount}/${practiceTasks.length} câu (${percent}%)`;
        document.getElementById('finish-title').innerText = awardedStars === 3 ? "Xuất sắc! Đạt 3 sao" : (awardedStars === 2 ? "Rất tốt! Đạt 2 sao" : "Hoàn thành! Đạt 1 sao");
        document.getElementById('part-quiz-finish').classList.remove('hidden');
        return;
      }

      const percent = (currentTaskIdx / practiceTasks.length) * 100;
      document.getElementById('practice-progress-bar').style.width = `${percent}%`;
      document.getElementById('practice-counter').innerText = `${currentTaskIdx + 1}/${practiceTasks.length}`;

      const task = practiceTasks[currentTaskIdx];
      if (task.type === 'meaning') renderPartMeaning(task.data);
      else if (task.type === 'gap') renderPartGap(task.data);
    }

    function renderPartMeaning(wordObj) {
      document.getElementById('practice-header-title').innerText = "Chọn nghĩa của từ";
      document.getElementById('part-quiz-meaning').classList.remove('hidden');
      document.getElementById('pq1-kanji').innerText = wordObj.kanji;
      document.getElementById('pq1-furigana').innerText = wordObj.furigana;

      const allWords = JAPANESE_LESSONS[currentLessonIdx].words;
      let options = [wordObj.meaning];
      while (options.length < 4) {
        const rand = allWords[Math.floor(Math.random() * allWords.length)].meaning;
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);

      const container = document.getElementById('pq1-options');
      container.innerHTML = '';
      let answered = false;

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full p-4 rounded-2xl border border-slate-200 hover:border-red-400 text-left text-sm font-medium text-slate-700 transition";
        btn.innerText = opt;
        btn.onclick = () => {
          if (answered) return;
          answered = true;
          if (opt === wordObj.meaning) {
            correctAnswersCount++;
            btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-700');
          } else {
            btn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-700');
          }
          setTimeout(() => {
            currentTaskIdx++;
            renderCurrentPracticeTask();
          }, 500);
        };
        container.appendChild(btn);
      });
      speakJapanese(wordObj.kanji);
    }

    function renderPartGap(gapData) {
      currentGapTaskData = gapData;
      document.getElementById('practice-header-title').innerText = "Nghe âm thanh, điền từ vào câu";
      document.getElementById('part-quiz-gap').classList.remove('hidden');

      document.getElementById('pq2-reading').innerText = gapData.sentenceReading;
      document.getElementById('pq2-sentence').innerHTML = gapData.gapSentence.replace('_______', '<span class="inline-block border-b-2 border-slate-700 w-20 mx-1"></span>');

      const allWords = JAPANESE_LESSONS[currentLessonIdx].words;
      let options = [gapData.word];
      while (options.length < 4) {
        const rand = allWords[Math.floor(Math.random() * allWords.length)].kanji;
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);

      const container = document.getElementById('pq2-options');
      container.innerHTML = '';
      let answered = false;

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full p-3.5 rounded-2xl border border-slate-200 hover:border-red-400 text-center font-bold text-slate-800 transition text-lg";
        btn.innerText = opt;
        btn.onclick = () => {
          if (answered) return;
          answered = true;
          if (opt === gapData.word) {
            correctAnswersCount++;
            btn.classList.add('bg-emerald-50', 'border-emerald-500');
          } else {
            btn.classList.add('bg-rose-50', 'border-rose-500');
          }
          setTimeout(() => {
            currentTaskIdx++;
            renderCurrentPracticeTask();
          }, 500);
        };
        container.appendChild(btn);
      });
      speakJapanese(gapData.fullJa);
    }

    function finishAndBackToLessons() {
      showScreen('screen-lessons');
    }

    window.onload = () => {
      renderLessonGrid();
    };
  </script>
</body>
</html>
