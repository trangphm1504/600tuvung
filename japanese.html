  <!-- Firebase Auth & Firestore Sync -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCizgsPFGkkdbVYl4VAqfggphPvM4l6AnQ",
      authDomain: "tuvung-ba736.firebaseapp.com",
      projectId: "tuvung-ba736",
      storageBucket: "tuvung-ba736.firebasestorage.app",
      messagingSenderId: "283132513140",
      appId: "1:283132513140:web:a388c1171785d7cfe4fa21",
      measurementId: "G-KX30813EGG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.currentUser = null;

    window.loginWithGoogle = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("Đăng nhập thất bại: " + err.message);
      }
    };

    window.logoutGoogle = async () => {
      await signOut(auth);
      location.reload();
    };

    onAuthStateChanged(auth, async (user) => {
      window.currentUser = user;
      const loginBtn = document.getElementById('btn-login');
      const profile = document.getElementById('user-profile');
      const avatar = document.getElementById('user-avatar');

      if (user) {
        if (loginBtn) loginBtn.classList.add('hidden');
        if (profile) profile.classList.remove('hidden');
        if (avatar) avatar.src = user.photoURL || 'https://via.placeholder.com/32';

        try {
          const docRef = doc(db, "users", user.uid);
          const docSnap = await getDoc(docRef);
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.daichiStageProgress) {
              window.stageProgress = data.daichiStageProgress;
              localStorage.setItem('daichi_stage_progress', JSON.stringify(window.stageProgress));
            }
            if (typeof renderLessonGrid === 'function') renderLessonGrid();
          } else {
            window.syncProgressToCloud();
          }
        } catch (e) {
          console.error("Lỗi tải đám mây:", e);
        }
      } else {
        if (loginBtn) loginBtn.classList.remove('hidden');
        if (profile) profile.classList.add('hidden');
      }
    });

    window.syncProgressToCloud = async () => {
      if (!window.currentUser) return;
      try {
        const docRef = doc(db, "users", window.currentUser.uid);
        await setDoc(docRef, {
          daichiStageProgress: window.stageProgress,
          updatedAt: new Date().toISOString()
        }, { merge: true });
      } catch (e) {
        console.error("Lỗi lưu đám mây:", e);
      }
    };
  </script>

          { id: 2322, kanji: "材料", furigana: "ざいりょう", pos: "Danh từ", meaning: "nguyên vật liệu chế biến", example: { ja: "料理の材料を買います。", reading: "りょうりのざいりょうをかいます。", vi: "Mua nguyên liệu nấu ăn." } },
          { id: 2323, kanji: "ボタン", furigana: "ボタン", pos: "Danh từ", meaning: "nút bấm", example: { ja: "ボタンを押してください。", reading: "ボタンをおしてください。", vi: "Xin hãy ấn nút bấm." } },
          { id: 2324, kanji: "交差点", furigana: "こうさてん", pos: "Danh từ", meaning: "ngã tư, giao lộ", example: { ja: "交差点を右に曲がります。", reading: "こうさてんをみぎにまがります。", vi: "Rẽ phải ở ngã tư." } },
          { id: 2325, kanji: "季節", furigana: "きせつ", pos: "Danh từ", meaning: "mùa", example: { ja: "好きな季節は秋です。", reading: "すきなきせつはあきです。", vi: "Mùa tôi thích là mùa thu." } },
          { id: 2326, kanji: "雨季", furigana: "うき", pos: "Danh từ", meaning: "mùa mưa", example: { ja: "6月は雨季です。", reading: "ろくがつはうきです。", vi: "Tháng 6 là mùa mưa." } },
          { id: 2327, kanji: "乾季", furigana: "かんき", pos: "Danh từ", meaning: "mùa khô", example: { ja: "乾季は雨が降りません。", reading: "かんきはあめがふりません。", vi: "Mùa khô thì không có mưa." } }
        ]
      }
    ];

    // CẤU HÌNH BĂM NHỎ: Mỗi cửa tối đa 15 từ
    const WORDS_PER_STAGE = 15;

    // Lưu trữ số sao của từng chặng: { "23_1": 3, "23_2": 2 }
    window.stageProgress = JSON.parse(localStorage.getItem('daichi_stage_progress') || '{}');

    function saveProgress() {
      localStorage.setItem('daichi_stage_progress', JSON.stringify(window.stageProgress));
      renderLessonGrid();
      if (window.syncProgressToCloud) window.syncProgressToCloud();
    }

    function resetAllProgress() {
      if (confirm("Đặt lại toàn bộ tiến trình học Daichi 2?")) {
        window.stageProgress = {};
        localStorage.removeItem('daichi_stage_progress');
        saveProgress();
      }
    }

    let isSlowSpeech = false;
    function speakJapanese(text, rate = 1) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = isSlowSpeech ? 0.7 : rate;
        window.speechSynthesis.speak(utterance);
      }
    }

    function toggleSlowSpeed() {
      isSlowSpeech = !isSlowSpeech;
      const btn = document.getElementById('btn-tortoise');
      btn.className = isSlowSpeech ? "text-amber-500 font-bold" : "hover:text-red-500 transition text-base";
      if (currentWord) speakJapanese(currentWord.kanji);
    }

    function showScreen(screenId) {
      ['screen-lessons', 'screen-stages', 'screen-stage-detail', 'screen-study', 'screen-practice-wrapper'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }

    // 1. RENDER MÀN HÌNH CHÍNH (Bài 23 -> 42)
    window.renderLessonGrid = function() {
      const container = document.getElementById('lesson-grid');
      container.innerHTML = '';
      let totalStars = 0;

      for (let i = 23; i <= 42; i++) {
        // Tính tổng sao của bài bằng tổng sao các stage thuộc bài đó
        let lessonStars = 0;
        for (let s = 1; s <= 5; s++) {
          lessonStars += window.stageProgress[`${i}_${s}`] || 0;
        }
        totalStars += lessonStars;

        const btn = document.createElement('button');
        const borderClass = lessonStars > 0 ? "border-red-400 shadow-sm" : "border-slate-200 opacity-90";
        btn.className = `flex flex-col items-center justify-between p-2.5 rounded-2xl border-2 ${borderClass} bg-white hover:border-red-400 active:scale-95 transition h-20`;
        btn.innerHTML = `
          <div class="w-full flex justify-end"><span class="text-[9px] font-bold bg-red-500 text-white rounded px-1">N4</span></div>
          <span class="text-base font-bold text-red-600">${i}</span>
          <div class="text-[10px] text-amber-500 font-bold flex items-center">
            <i class="fa-solid fa-star text-[9px] mr-0.5"></i> ${lessonStars}
          </div>
        `;
        btn.onclick = () => openLessonStages(i);
        container.appendChild(btn);
      }
      document.getElementById('total-stars-count').innerText = totalStars;
    };

    // 2. MỞ DANH SÁCH CÁC CỬA CON CỦA BÀI HỌC
    let selectedLessonId = 23;
    let currentStageIndex = 0;
    let currentStageWords = [];

    function openLessonStages(lessonId) {
      selectedLessonId = lessonId;
      const lesson = JAPANESE_LESSONS.find(l => l.id === lessonId) || JAPANESE_LESSONS[0];
      
      document.getElementById('stages-lesson-title').innerText = `第${lesson.id}課`;
      document.getElementById('stages-count-badge').innerText = `${lesson.words.length} từ vựng`;

      const stagesContainer = document.getElementById('stage-cards-container');
      stagesContainer.innerHTML = '';

      // Tự động chia bài thành các chặng 15 từ
      const totalStages = Math.ceil(lesson.words.length / WORDS_PER_STAGE);

      for (let s = 0; s < totalStages; s++) {
        const startIdx = s * WORDS_PER_STAGE;
        const endIdx = Math.min(startIdx + WORDS_PER_STAGE, lesson.words.length);
        const stageWords = lesson.words.slice(startIdx, endIdx);
        const stageKey = `${lesson.id}_${s + 1}`;
        const stars = window.stageProgress[stageKey] || 0;

        let starsHtml = '';
        for (let star = 1; star <= 3; star++) {
          starsHtml += star <= stars ? `<i class="fa-solid fa-star text-amber-400"></i>` : `<i class="fa-solid fa-star text-slate-200"></i>`;
        }

        const card = document.createElement('div');
        card.className = "p-4 rounded-2xl border-2 border-slate-100 hover:border-red-300 bg-slate-50 flex items-center justify-between cursor-pointer transition shadow-sm";
        card.onclick = () => openStageDetail(s, stageWords);
        card.innerHTML = `
          <div class="flex items-center space-x-3.5">
            <div class="w-11 h-11 bg-white border border-red-200 text-red-600 rounded-xl flex items-center justify-center font-black text-base shadow-sm">
              ${s + 1}
            </div>
            <div>
              <h4 class="font-bold text-slate-800 text-sm">Cửa số ${s + 1} (Từ ${startIdx + 1} ~ ${endIdx})</h4>
              <p class="text-xs text-slate-400 mt-0.5">Quy mô: ${stageWords.length} từ</p>
            </div>
          </div>
          <div class="text-sm flex space-x-1">${starsHtml}</div>
        `;
        stagesContainer.appendChild(card);
      }

      showScreen('screen-stages');
    }

    // 3. MỞ CHI TIẾT CỬA ĐÃ CHỌN
    function openStageDetail(stageIdx, words) {
      currentStageIndex = stageIdx;
      currentStageWords = words;

      document.getElementById('detail-stage-name').innerText = `Cửa số ${stageIdx + 1} - 第${selectedLessonId}課`;
      document.getElementById('detail-stage-desc').innerText = `Danh sách ${words.length} từ vựng mục tiêu`;

      const listContainer = document.getElementById('detail-word-list');
      listContainer.innerHTML = '';

      words.forEach(w => {
        const row = document.createElement('div');
        row.className = "py-3 flex flex-col justify-center";
        row.innerHTML = `
          <span class="text-xs text-slate-400 font-medium">${w.furigana}</span>
          <h4 class="text-xl font-bold text-slate-800">${w.kanji}</h4>
          <p class="text-xs text-slate-500 mt-0.5"><span class="text-red-500 mr-2 font-medium">${w.pos}</span>${w.meaning}</p>
        `;
        listContainer.appendChild(row);
      });

      showScreen('screen-stage-detail');
    }

    // 4. HỌC TỪ
    let currentWordIdx = 0;
    let currentWord = null;

    function startLearningMode() {
      currentWordIdx = 0;
      loadStudyWord();
      showScreen('screen-study');
    }

    function loadStudyWord() {
      currentWord = currentStageWords[currentWordIdx];
      const percent = ((currentWordIdx + 1) / currentStageWords.length) * 100;
      document.getElementById('study-progress-bar').style.width = `${percent}%`;

      document.getElementById('study-furigana').innerText = currentWord.furigana;
      document.getElementById('study-kanji').innerText = currentWord.kanji;
      document.getElementById('study-pos').innerText = currentWord.pos;
      document.getElementById('study-meaning').innerText = currentWord.meaning;
      document.getElementById('study-meaning').classList.add('hidden');

      document.getElementById('ex1-ja').innerText = currentWord.example.ja;
      document.getElementById('ex1-reading').innerText = currentWord.example.reading;
      document.getElementById('ex1-vi').innerText = currentWord.example.vi;
      document.getElementById('ex1-vi').classList.add('hidden');

      document.getElementById('btn-show-meaning').classList.remove('hidden');
      document.getElementById('btn-next-word').classList.add('hidden');
      speakJapanese(currentWord.kanji);
    }

    function revealMeaning() {
      document.getElementById('study-meaning').classList.remove('hidden');
      document.getElementById('ex1-vi').classList.remove('hidden');
      document.getElementById('btn-show-meaning').classList.add('hidden');
      document.getElementById('btn-next-word').classList.remove('hidden');
    }

    function nextStudyWord() {
      if (currentWordIdx < currentStageWords.length - 1) {
        currentWordIdx++;
        loadStudyWord();
      } else {
        const stageKey = `${selectedLessonId}_${currentStageIndex + 1}`;
        if (!window.stageProgress[stageKey]) window.stageProgress[stageKey] = 1;
        saveProgress();
        alert("Đã xem qua hết từ của cửa này! Đạt ⭐ 1 SAO. Hãy vào Luyện tập để lấy 3 sao nhé!");
        startCombinedPractice();
      }
    }

    // 5. LUYỆN TẬP
    let practiceTasks = [];
    let currentTaskIdx = 0;
    let correctAnswersCount = 0;

    function startCombinedPractice() {
      practiceTasks = [];
      correctAnswersCount = 0;

      // 4 câu chọn nghĩa
      const shuffledMeaning = [...currentStageWords].sort(() => Math.random() - 0.5).slice(0, 4);
      shuffledMeaning.forEach(w => practiceTasks.push({ type: 'meaning', data: w }));

      // 2 câu nghe điền câu ví dụ ngữ pháp
      const shuffledGap = [...currentStageWords].sort(() => Math.random() - 0.5).slice(0, 2);
      shuffledGap.forEach(w => {
        practiceTasks.push({
          type: 'gap',
          data: {
            word: w.kanji,
            reading: w.furigana,
            fullJa: w.example.ja,
            sentenceReading: w.example.reading,
            gapSentence: w.example.ja.replace(w.kanji, '_______')
          }
        });
      });

      practiceTasks.sort(() => Math.random() - 0.5);
      currentTaskIdx = 0;
      showScreen('screen-practice-wrapper');
      renderCurrentPracticeTask();
    }

    let currentGapTaskData = null;
    function renderCurrentPracticeTask() {
      document.getElementById('part-quiz-meaning').classList.add('hidden');
      document.getElementById('part-quiz-gap').classList.add('hidden');
      document.getElementById('part-quiz-finish').classList.add('hidden');

      if (currentTaskIdx >= practiceTasks.length) {
        const percent = Math.round((correctAnswersCount / practiceTasks.length) * 100);
        let awardedStars = percent >= 80 ? 3 : (percent >= 60 ? 2 : 1);

        const stageKey = `${selectedLessonId}_${currentStageIndex + 1}`;
        if (awardedStars > (window.stageProgress[stageKey] || 0)) {
          window.stageProgress[stageKey] = awardedStars;
        }
        saveProgress();

        let starIcons = '';
        for (let s = 1; s <= 3; s++) {
          starIcons += s <= awardedStars ? `<i class="fa-solid fa-star text-amber-400"></i>` : `<i class="fa-solid fa-star text-slate-200"></i>`;
        }
        document.getElementById('finish-stars').innerHTML = starIcons;
        document.getElementById('finish-score-desc').innerText = `Chính xác ${correctAnswersCount}/${practiceTasks.length} câu (${percent}%)`;
        document.getElementById('finish-title').innerText = awardedStars === 3 ? "Xuất sắc! Đạt 3 sao" : (awardedStars === 2 ? "Rất tốt! Đạt 2 sao" : "Hoàn thành! Đạt 1 sao");
        document.getElementById('part-quiz-finish').classList.remove('hidden');
        return;
      }

      const percent = (currentTaskIdx / practiceTasks.length) * 100;
      document.getElementById('practice-progress-bar').style.width = `${percent}%`;
      document.getElementById('practice-counter').innerText = `${currentTaskIdx + 1}/${practiceTasks.length}`;

      const task = practiceTasks[currentTaskIdx];
      if (task.type === 'meaning') renderPartMeaning(task.data);
      else if (task.type === 'gap') renderPartGap(task.data);
    }

    function renderPartMeaning(wordObj) {
      document.getElementById('practice-header-title').innerText = "Chọn nghĩa của từ";
      document.getElementById('part-quiz-meaning').classList.remove('hidden');
      document.getElementById('pq1-kanji').innerText = wordObj.kanji;
      document.getElementById('pq1-furigana').innerText = wordObj.furigana;

      let options = [wordObj.meaning];
      while (options.length < 4) {
        const rand = currentStageWords[Math.floor(Math.random() * currentStageWords.length)].meaning;
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);

      const container = document.getElementById('pq1-options');
      container.innerHTML = '';
      let answered = false;

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full p-4 rounded-2xl border border-slate-200 hover:border-red-400 text-left text-sm font-medium text-slate-700 transition";
        btn.innerText = opt;
        btn.onclick = () => {
          if (answered) return;
          answered = true;
          if (opt === wordObj.meaning) {
            correctAnswersCount++;
            btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-700');
          } else {
            btn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-700');
          }
          setTimeout(() => {
            currentTaskIdx++;
            renderCurrentPracticeTask();
          }, 500);
        };
        container.appendChild(btn);
      });
      speakJapanese(wordObj.kanji);
    }

    function renderPartGap(gapData) {
      currentGapTaskData = gapData;
      document.getElementById('practice-header-title').innerText = "Nghe âm thanh, điền từ vào câu";
      document.getElementById('part-quiz-gap').classList.remove('hidden');

      document.getElementById('pq2-reading').innerText = gapData.sentenceReading;
      document.getElementById('pq2-sentence').innerHTML = gapData.gapSentence.replace('_______', '<span class="inline-block border-b-2 border-slate-700 w-20 mx-1"></span>');

      let options = [gapData.word];
      while (options.length < 4) {
        const rand = currentStageWords[Math.floor(Math.random() * currentStageWords.length)].kanji;
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);

      const container = document.getElementById('pq2-options');
      container.innerHTML = '';
      let answered = false;

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full p-3.5 rounded-2xl border border-slate-200 hover:border-red-400 text-center font-bold text-slate-800 transition text-lg";
        btn.innerText = opt;
        btn.onclick = () => {
          if (answered) return;
          answered = true;
          if (opt === gapData.word) {
            correctAnswersCount++;
            btn.classList.add('bg-emerald-50', 'border-emerald-500');
          } else {
            btn.classList.add('bg-rose-50', 'border-rose-500');
          }
          setTimeout(() => {
            currentTaskIdx++;
            renderCurrentPracticeTask();
          }, 500);
        };
        container.appendChild(btn);
      });
      speakJapanese(gapData.fullJa);
    }

    function finishAndBackToStages() {
      openLessonStages(selectedLessonId);
    }

    window.onload = () => {
      renderLessonGrid();
    };
  </script>
</body>
</html>
