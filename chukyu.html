<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>N3 - 中級へ行こう (Tiền Trung Cấp)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Nạp file dữ liệu từ vựng Trung cấp -->
  <script src="data_chukyu.js"></script>
  
  <!-- Cấu hình Firebase & Đồng bộ dữ liệu -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCizgsPFGkkdbVYl4VAqfggphPvM4l6AnQ",
      authDomain: "tuvung-ba736.firebaseapp.com",
      projectId: "tuvung-ba736",
      storageBucket: "tuvung-ba736.firebasestorage.app",
      messagingSenderId: "283132513140",
      appId: "1:283132513140:web:a388c1171785d7cfe4fa21",
      measurementId: "G-KX30813EGG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.currentUser = null;

    window.loginWithGoogle = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("Đăng nhập thất bại: " + err.message);
      }
    };

    window.logoutGoogle = async () => {
      await signOut(auth);
      location.reload();
    };

    onAuthStateChanged(auth, async (user) => {
      window.currentUser = user;
      const loginBtn = document.getElementById('btn-login');
      const profile = document.getElementById('user-profile');
      const avatar = document.getElementById('user-avatar');

      if (user) {
        if (loginBtn) loginBtn.classList.add('hidden');
        if (profile) profile.classList.remove('hidden');
        if (avatar) avatar.src = user.photoURL || 'https://via.placeholder.com/32';

        try {
          const docRef = doc(db, "users", user.uid);
          const docSnap = await getDoc(docRef);
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.chukyuStageProgress) {
              window.chukyuProgress = data.chukyuStageProgress;
              localStorage.setItem('chukyu_stage_progress', JSON.stringify(window.chukyuProgress));
            }
            if (typeof renderLessonGrid === 'function') renderLessonGrid();
          } else {
            window.syncProgressToCloud();
          }
        } catch (e) {
          console.error("Lỗi tải đám mây:", e);
        }
      } else {
        if (loginBtn) loginBtn.classList.remove('hidden');
        if (profile) profile.classList.add('hidden');
      }
    });

    window.syncProgressToCloud = async () => {
      if (!window.currentUser) return;
      try {
        const docRef = doc(db, "users", window.currentUser.uid);
        await setDoc(docRef, {
          chukyuStageProgress: window.chukyuProgress,
          updatedAt: new Date().toISOString()
        }, { merge: true });
      } catch (e) {
        console.error("Lỗi lưu đám mây:", e);
      }
    };
  </script>

  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    .furigana-sub { font-size: 0.85rem; line-height: 1.2rem; color: #64748b; }
  </style>
</head>
<body class="bg-slate-100 flex justify-center min-h-screen text-slate-800">

    <!-- MÀN HÌNH 1: TỔNG QUAN 10 BÀI TRUNG CẤP -->

  <script>
    function getChukyuLessons() {
      return window.CHUKYU_LESSONS || [];
    }   

    const WORDS_PER_STAGE = 15;
    window.chukyuProgress = JSON.parse(localStorage.getItem('chukyu_stage_progress') || '{}');

    function saveProgress() {
      localStorage.setItem('chukyu_stage_progress', JSON.stringify(window.chukyuProgress));
      renderLessonGrid();
      if (window.syncProgressToCloud) window.syncProgressToCloud();
    }

    function resetAllProgress() {
      if (confirm("Đặt lại toàn bộ tiến trình sách Trung cấp?")) {
        window.chukyuProgress = {};
        localStorage.removeItem('chukyu_stage_progress');
        saveProgress();
      }
    }

    let isSlowSpeech = false;
    function speakJapanese(text, rate = 1) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = isSlowSpeech ? 0.7 : rate;
        window.speechSynthesis.speak(utterance);
      }
    }

    function toggleSlowSpeed() {
      isSlowSpeech = !isSlowSpeech;
      const btn = document.getElementById('btn-tortoise');
      btn.className = isSlowSpeech ? "text-amber-500 font-bold" : "hover:text-emerald-600";
      if (currentWord) speakJapanese(currentWord.kanji);
    }

    function showScreen(screenId) {
      ['screen-lessons', 'screen-stages', 'screen-stage-detail', 'screen-study', 'screen-practice-wrapper'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }

    window.renderLessonGrid = function() {
      const container = document.getElementById('lesson-grid');
      if (!container) return;
      container.innerHTML = '';
      let totalStars = 0;

      for (let i = 1; i <= 10; i++) {
        let lessonStars = 0;
        for (let s = 1; s <= 5; s++) {
          lessonStars += window.chukyuProgress[`${i}_${s}`] || 0;
        }
        totalStars += lessonStars;

        const btn = document.createElement('button');
        const borderClass = lessonStars > 0 ? "border-emerald-500 shadow-sm" : "border-slate-200 opacity-90";
        btn.className = `flex flex-col items-center justify-between p-2.5 rounded-2xl border-2 ${borderClass} bg-white hover:border-emerald-500 active:scale-95 transition h-20`;
        btn.innerHTML = `
          <div class="w-full flex justify-end"><span class="text-[9px] font-bold bg-emerald-600 text-white rounded px-1">N3</span></div>
          <span class="text-base font-bold text-emerald-700">${i}</span>
          <div class="text-[10px] text-amber-500 font-bold flex items-center">
            <i class="fa-solid fa-star text-[9px] mr-0.5"></i> ${lessonStars}
          </div>
        `;
        btn.onclick = () => openLessonStages(i);
        container.appendChild(btn);
      }
      const totalStarsEl = document.getElementById('total-stars-count');
      if (totalStarsEl) totalStarsEl.innerText = totalStars;
    };

    let selectedLessonId = 1;
    let currentStageIndex = 0;
    let currentStageWords = [];

    function openLessonStages(lessonId) {
      selectedLessonId = lessonId;
      const lesson = getChukyuLessons().find(l => l.id === lessonId);
      if (!lesson) {
        alert("Dữ liệu bài này đang được cập nhật!");
        return;
      }
      
      document.getElementById('stages-lesson-title').innerText = lesson.title;
      document.getElementById('stages-count-badge').innerText = `${lesson.words.length} từ vựng`;

      const stagesContainer = document.getElementById('stage-cards-container');
      stagesContainer.innerHTML = '';

      const totalStages = Math.ceil(lesson.words.length / WORDS_PER_STAGE);

      for (let s = 0; s < totalStages; s++) {
        const startIdx = s * WORDS_PER_STAGE;
        const endIdx = Math.min(startIdx + WORDS_PER_STAGE, lesson.words.length);
        const stageWords = lesson.words.slice(startIdx, endIdx);
        const stageKey = `${lesson.id}_${s + 1}`;
        const stars = window.chukyuProgress[stageKey] || 0;

        let starsHtml = '';
        for (let star = 1; star <= 3; star++) {
          starsHtml += star <= stars ? `<i class="fa-solid fa-star text-amber-400"></i>` : `<i class="fa-solid fa-star text-slate-200"></i>`;
        }

        const card = document.createElement('div');
        card.className = "p-4 rounded-2xl border-2 border-slate-100 hover:border-emerald-300 bg-slate-50 flex items-center justify-between cursor-pointer transition shadow-sm";
        card.onclick = () => openStageDetail(s, stageWords);
        card.innerHTML = `
          <div class="flex items-center space-x-3.5">
            <div class="w-11 h-11 bg-white border border-emerald-200 text-emerald-700 rounded-xl flex items-center justify-center font-black text-base shadow-sm">
              ${s + 1}
            </div>
            <div>
              <h4 class="font-bold text-slate-800 text-sm">Cửa số ${s + 1} (Từ ${startIdx + 1} ~ ${endIdx})</h4>
              <p class="text-xs text-slate-400 mt-0.5">Quy mô: ${stageWords.length} từ</p>
            </div>
          </div>
          <div class="text-sm flex space-x-1">${starsHtml}</div>
        `;
        stagesContainer.appendChild(card);
      }

      showScreen('screen-stages');
    }

    function openStageDetail(stageIdx, words) {
      currentStageIndex = stageIdx;
      currentStageWords = words;

      document.getElementById('detail-stage-name').innerText = `Cửa số ${stageIdx + 1} - Bài ${selectedLessonId}`;
      document.getElementById('detail-stage-desc').innerText = `Gồm ${words.length} từ vựng trung cấp`;

      const listContainer = document.getElementById('detail-word-list');
      listContainer.innerHTML = '';

      words.forEach(w => {
        const row = document.createElement('div');
        row.className = "py-3 flex flex-col justify-center";
        row.innerHTML = `
          <span class="text-xs text-slate-400 font-medium">${w.furigana}</span>
          <h4 class="text-xl font-bold text-slate-800">${w.kanji}</h4>
          <p class="text-xs text-slate-500 mt-0.5"><span class="text-emerald-600 mr-2 font-medium">${w.pos}</span>${w.meaning}</p>
        `;
        listContainer.appendChild(row);
      });

      showScreen('screen-stage-detail');
    }

    let currentWordIdx = 0;
    let currentWord = null;

    function startLearningMode() {
      currentWordIdx = 0;
      loadStudyWord();
      showScreen('screen-study');
    }

    function loadStudyWord() {
      currentWord = currentStageWords[currentWordIdx];
      const percent = ((currentWordIdx + 1) / currentStageWords.length) * 100;
      document.getElementById('study-progress-bar').style.width = `${percent}%`;

      document.getElementById('study-furigana').innerText = currentWord.furigana;
      document.getElementById('study-kanji').innerText = currentWord.kanji;
      document.getElementById('study-pos').innerText = currentWord.pos;
      document.getElementById('study-meaning').innerText = currentWord.meaning;
      document.getElementById('study-meaning').classList.add('hidden');

      document.getElementById('ex1-ja').innerText = currentWord.example.ja;
      document.getElementById('ex1-reading').innerText = currentWord.example.reading;
      document.getElementById('ex1-vi').innerText = currentWord.example.vi;
      document.getElementById('ex1-vi').classList.add('hidden');

      document.getElementById('btn-show-meaning').classList.remove('hidden');
      document.getElementById('btn-next-word').classList.add('hidden');
      speakJapanese(currentWord.kanji);
    }

    function revealMeaning() {
      document.getElementById('study-meaning').classList.remove('hidden');
      document.getElementById('ex1-vi').classList.remove('hidden');
      document.getElementById('btn-show-meaning').classList.add('hidden');
      document.getElementById('btn-next-word').classList.remove('hidden');
    }

    function nextStudyWord() {
      if (currentWordIdx < currentStageWords.length - 1) {
        currentWordIdx++;
        loadStudyWord();
      } else {
        const stageKey = `${selectedLessonId}_${currentStageIndex + 1}`;
        if (!window.chukyuProgress[stageKey]) window.chukyuProgress[stageKey] = 1;
        saveProgress();
        alert("Đã xem qua hết từ của cửa này! Đạt ⭐ 1 SAO. Hãy vào Luyện tập để lấy 3 sao!");
        startCombinedPractice();
      }
    }

    let practiceTasks = [];
    let currentTaskIdx = 0;
    let correctAnswersCount = 0;

    function startCombinedPractice() {
      practiceTasks = [];
      correctAnswersCount = 0;

      // 1. 3 câu Chọn nghĩa
      const shuffledMeaning = [...currentStageWords].sort(() => Math.random() - 0.5).slice(0, 3);
      shuffledMeaning.forEach(w => practiceTasks.push({ type: 'meaning', data: w }));

      // 2. 2 câu Nghe điền câu (Đã sửa thuật toán nhận diện thể chia)
      const shuffledGap = [...currentStageWords].sort(() => Math.random() - 0.5).slice(0, 2);
      shuffledGap.forEach(w => {
        // Tách gốc Hán tự (loại bỏ phần chú giải trong ngoặc và Okurigana đuôi)
        const pureKanji = w.kanji.replace(/\[.*?\]|\(.*?\)/g, '').trim();
        const root = pureKanji.replace(/[ぁ-ん]+$/, '') || pureKanji;
        
        let gapSentence = w.example.ja;
        if (gapSentence.includes(w.kanji)) {
          gapSentence = gapSentence.replace(w.kanji, '_______');
        } else if (root && gapSentence.includes(root)) {
          gapSentence = gapSentence.replace(new RegExp(root + '[ぁ-ん]*', 'g'), '_______');
        } else if (gapSentence.includes(w.furigana)) {
          gapSentence = gapSentence.replace(w.furigana, '_______');
        }

        practiceTasks.push({
          type: 'gap',
          data: {
            word: w.kanji,
            meaning: w.meaning,
            fullJa: w.example.ja,
            vi: w.example.vi,
            gapSentence: gapSentence
          }
        });
      });

      // 3. 1 bài Ghép cặp âm thanh (4 từ)
      const shuffledMatch = [...currentStageWords].sort(() => Math.random() - 0.5).slice(0, 4);
      practiceTasks.push({
        type: 'match',
        data: shuffledMatch
      });

      practiceTasks.sort(() => Math.random() - 0.5);
      currentTaskIdx = 0;
      showScreen('screen-practice-wrapper');
      renderCurrentPracticeTask();
    }

    let currentGapTaskData = null;
    function renderCurrentPracticeTask() {
      document.getElementById('part-quiz-meaning').classList.add('hidden');
      document.getElementById('part-quiz-gap').classList.add('hidden');
      document.getElementById('part-quiz-match').classList.add('hidden');
      document.getElementById('part-quiz-finish').classList.add('hidden');

      if (currentTaskIdx >= practiceTasks.length) {
        const percent = Math.round((correctAnswersCount / practiceTasks.length) * 100);
        let awardedStars = percent >= 80 ? 3 : (percent >= 60 ? 2 : 1);

        const stageKey = `${selectedLessonId}_${currentStageIndex + 1}`;
        if (awardedStars > (window.chukyuProgress[stageKey] || 0)) {
          window.chukyuProgress[stageKey] = awardedStars;
        }
        saveProgress();

        let starIcons = '';
        for (let s = 1; s <= 3; s++) {
          starIcons += s <= awardedStars ? `<i class="fa-solid fa-star text-amber-400"></i>` : `<i class="fa-solid fa-star text-slate-200"></i>`;
        }
        document.getElementById('finish-stars').innerHTML = starIcons;
        document.getElementById('finish-score-desc').innerText = `Chính xác ${correctAnswersCount}/${practiceTasks.length} câu (${percent}%)`;
        document.getElementById('finish-title').innerText = awardedStars === 3 ? "Xuất sắc! Đạt 3 sao" : (awardedStars === 2 ? "Rất tốt! Đạt 2 sao" : "Hoàn thành! Đạt 1 sao");
        document.getElementById('part-quiz-finish').classList.remove('hidden');
        return;
      }

      const percent = (currentTaskIdx / practiceTasks.length) * 100;
      document.getElementById('practice-progress-bar').style.width = `${percent}%`;
      document.getElementById('practice-counter').innerText = `${currentTaskIdx + 1}/${practiceTasks.length}`;

      const task = practiceTasks[currentTaskIdx];
      if (task.type === 'meaning') renderPartMeaning(task.data);
      else if (task.type === 'gap') renderPartGap(task.data);
      else if (task.type === 'match') renderPartMatch(task.data);
    }

    function renderPartMeaning(wordObj) {
      document.getElementById('practice-header-title').innerText = "Chọn nghĩa của từ";
      document.getElementById('part-quiz-meaning').classList.remove('hidden');
      document.getElementById('pq1-kanji').innerText = wordObj.kanji;
      document.getElementById('pq1-furigana').innerText = wordObj.furigana;

      let options = [wordObj.meaning];
      while (options.length < 4) {
        const rand = currentStageWords[Math.floor(Math.random() * currentStageWords.length)].meaning;
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);

      const container = document.getElementById('pq1-options');
      container.innerHTML = '';
      let answered = false;

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full p-4 rounded-2xl border border-slate-200 hover:border-emerald-500 text-left text-sm font-medium text-slate-700 transition";
        btn.innerText = opt;
        btn.onclick = () => {
          if (answered) return;
          answered = true;
          if (opt === wordObj.meaning) {
            correctAnswersCount++;
            btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-700');
          } else {
            btn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-700');
          }
          setTimeout(() => {
            currentTaskIdx++;
            renderCurrentPracticeTask();
          }, 500);
        };
        container.appendChild(btn);
      });
      speakJapanese(wordObj.kanji);
    }

    function renderPartGap(gapData) {
      currentGapTaskData = gapData;
      document.getElementById('practice-header-title').innerText = "Nghe âm thanh, điền từ vào câu";
      document.getElementById('part-quiz-gap').classList.remove('hidden');

      // Ẩn phiên âm Hiragana lộ liễu, thay bằng nghĩa tiếng Việt của câu
      const readingEl = document.getElementById('pq2-reading');
      if (readingEl) {
        readingEl.innerText = gapData.vi || "";
      }

      // Tạo ô trống gạch chân hiển thị rõ ràng
      document.getElementById('pq2-sentence').innerHTML = gapData.gapSentence.replace(
        '_______', 
        '<span class="inline-block border-b-2 border-emerald-600 text-emerald-600 font-bold px-3 mx-1 min-w-[70px] text-center">_____</span>'
      );

      let options = [gapData.word];
      while (options.length < 4) {
        const rand = currentStageWords[Math.floor(Math.random() * currentStageWords.length)].kanji;
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);

      const container = document.getElementById('pq2-options');
      container.innerHTML = '';
      let answered = false;

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full p-3.5 rounded-2xl border border-slate-200 hover:border-emerald-500 text-center font-bold text-slate-800 transition text-lg bg-white shadow-sm";
        btn.innerText = opt;
        btn.onclick = () => {
          if (answered) return;
          answered = true;
          if (opt === gapData.word) {
            correctAnswersCount++;
            btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-700');
          } else {
            btn.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-700');
          }
          setTimeout(() => {
            currentTaskIdx++;
            renderCurrentPracticeTask();
          }, 500);
        };
        container.appendChild(btn);
      });
      speakJapanese(gapData.fullJa);
    }

    // ==========================================
    // LOGIC DẠNG BÀI GHÉP CẶP ÂM THANH (CHỌN HẾT MỚI KIỂM TRA)
    // ==========================================
    let matchPairsState = [];
    let currentActiveAudio = null;
    let selectedPairsMap = {};

    const PAIR_COLORS = [
      { border: "border-sky-500", bg: "bg-sky-50", text: "text-sky-700", ring: "ring-2 ring-sky-400" },
      { border: "border-amber-500", bg: "bg-amber-50", text: "text-amber-700", ring: "ring-2 ring-amber-400" },
      { border: "border-purple-500", bg: "bg-purple-50", text: "text-purple-700", ring: "ring-2 ring-purple-400" },
      { border: "border-emerald-500", bg: "bg-emerald-50", text: "text-emerald-700", ring: "ring-2 ring-emerald-400" }
    ];

    function renderPartMatch(wordsList) {
      document.getElementById('practice-header-title').innerText = "Ghép đủ các cặp rồi ấn kiểm tra";
      document.getElementById('part-quiz-match').classList.remove('hidden');

      matchPairsState = wordsList;
      currentActiveAudio = null;
      selectedPairsMap = {};
      document.getElementById('btn-pq3-check').disabled = true;

      const container = document.getElementById('pq3-match-container');
      container.innerHTML = '';

      let audioCol = [...wordsList].sort(() => Math.random() - 0.5);
      let textCol = [...wordsList].sort(() => Math.random() - 0.5);

      for (let i = 0; i < wordsList.length; i++) {
        // Cột Loa phát âm
        const audioBtn = document.createElement('button');
        const aItem = audioCol[i];
        audioBtn.id = `match-audio-${aItem.id}`;
        audioBtn.className = "h-20 bg-white border-2 border-slate-200 rounded-2xl flex items-center justify-center text-emerald-600 text-2xl shadow-sm transition";
        audioBtn.innerHTML = `<i class="fa-solid fa-volume-high"></i>`;
        audioBtn.onclick = () => selectAudioNode(aItem);

        // Cột Nghĩa tiếng Việt
        const textBtn = document.createElement('button');
        const tItem = textCol[i];
        textBtn.id = `match-text-${tItem.id}`;
        textBtn.className = "h-20 px-3 bg-white border-2 border-slate-200 rounded-2xl flex items-center justify-center text-center text-xs font-semibold text-slate-700 shadow-sm transition";
        textBtn.innerText = tItem.meaning;
        textBtn.onclick = () => selectTextNode(tItem);

        container.appendChild(audioBtn);
        container.appendChild(textBtn);
      }
    }

    function selectAudioNode(audioItem) {
      speakJapanese(audioItem.kanji);
      currentActiveAudio = audioItem;

      document.querySelectorAll('[id^="match-audio-"]').forEach(el => {
        el.classList.remove('ring-4', 'ring-emerald-400');
      });

      const audioBtn = document.getElementById(`match-audio-${audioItem.id}`);
      if (audioBtn) audioBtn.classList.add('ring-4', 'ring-emerald-400');
    }

    function selectTextNode(textItem) {
      if (!currentActiveAudio) {
        alert("Vui lòng bấm nghe âm thanh ở cột bên trái trước!");
        return;
      }

      const audioId = currentActiveAudio.id;
      const textId = textItem.id;

      // Hủy liên kết cũ nếu đáp án chữ này đã được ghép
      for (const aId in selectedPairsMap) {
        if (selectedPairsMap[aId] === textId) {
          delete selectedPairsMap[aId];
        }
      }

      selectedPairsMap[audioId] = textId;
      currentActiveAudio = null;

      refreshMatchStyles();
      checkAllPairsConnected();
    }

    function refreshMatchStyles() {
      document.querySelectorAll('[id^="match-audio-"]').forEach(el => {
        el.className = "h-20 bg-white border-2 border-slate-200 rounded-2xl flex items-center justify-center text-emerald-600 text-2xl shadow-sm transition";
      });
      document.querySelectorAll('[id^="match-text-"]').forEach(el => {
        el.className = "h-20 px-3 bg-white border-2 border-slate-200 rounded-2xl flex items-center justify-center text-center text-xs font-semibold text-slate-700 shadow-sm transition";
      });

      const connectedAudioIds = Object.keys(selectedPairsMap);
      connectedAudioIds.forEach((aId, index) => {
        const tId = selectedPairsMap[aId];
        const color = PAIR_COLORS[index % PAIR_COLORS.length];

        const aBtn = document.getElementById(`match-audio-${aId}`);
        const tBtn = document.getElementById(`match-text-${tId}`);

        if (aBtn) {
          aBtn.className = `h-20 border-2 rounded-2xl flex items-center justify-center text-2xl shadow-sm transition ${color.bg} ${color.border} ${color.text} ${color.ring}`;
        }
        if (tBtn) {
          tBtn.className = `h-20 px-3 border-2 rounded-2xl flex items-center justify-center text-center text-xs font-bold shadow-sm transition ${color.bg} ${color.border} ${color.text} ${color.ring}`;
        }
      });
    }

    function checkAllPairsConnected() {
      const totalPairs = matchPairsState.length;
      const currentPairsCount = Object.keys(selectedPairsMap).length;
      document.getElementById('btn-pq3-check').disabled = (currentPairsCount < totalPairs);
    }

    function checkMatchSelection() {
      let allCorrect = true;
      document.getElementById('btn-pq3-check').disabled = true;

      for (const aId in selectedPairsMap) {
        const tId = selectedPairsMap[aId];
        const aBtn = document.getElementById(`match-audio-${aId}`);
        const tBtn = document.getElementById(`match-text-${tId}`);

        if (parseInt(aId) === parseInt(tId)) {
          aBtn.className = "h-20 bg-emerald-100 border-2 border-emerald-500 text-emerald-700 rounded-2xl flex items-center justify-center text-2xl transition pointer-events-none";
          tBtn.className = "h-20 px-3 bg-emerald-100 border-2 border-emerald-500 text-emerald-800 font-bold text-center text-xs rounded-2xl flex items-center justify-center transition pointer-events-none";
        } else {
          allCorrect = false;
          aBtn.className = "h-20 bg-rose-100 border-2 border-rose-400 text-rose-600 rounded-2xl flex items-center justify-center text-2xl transition";
          tBtn.className = "h-20 px-3 bg-rose-100 border-2 border-rose-400 text-rose-700 font-bold text-center text-xs rounded-2xl flex items-center justify-center transition";
        }
      }

      if (allCorrect) {
        correctAnswersCount++;
        setTimeout(() => {
          currentTaskIdx++;
          renderCurrentPracticeTask();
        }, 800);
      } else {
        setTimeout(() => {
          alert("Có đáp án chưa chính xác, hãy nghe và nối lại nhé!");
          selectedPairsMap = {};
          refreshMatchStyles();
          checkAllPairsConnected();
        }, 900);
      }
    }

    function finishAndBackToStages() {
      openLessonStages(selectedLessonId);
    }

    window.onload = () => {
      setTimeout(() => {
        renderLessonGrid();
      }, 50);
    };
  </script>
</body>
